services:
  bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?set API_AUTH_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u;u.urlopen('http://127.0.0.1:%s/healthz'%os.environ.get('WHATSAPP_BRIDGE_PORT','8080'),timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/whatsapp-bridge/store
